name: Deploy Vue to GitHub Pages

on:
  # 推送到 main 分支时触发部署
  push:
    branches: [main]
  
  # 允许手动触发部署
  workflow_dispatch:

# 设置必要的权限
permissions:
  contents: read
  pages: write      # 必须有写入权限
  id-token: write   # 必须用于身份验证

# 确保每次只有一个部署在进行，避免冲突
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 构建阶段
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'  # 确保版本兼容
          cache: 'npm'             # 缓存依赖，加速构建
      
      - name: 安装依赖
        run: npm ci                # 使用 ci 命令确保依赖一致性
      
      - name: 构建项目
        run: npm run build
        env:
          NODE_ENV: production     # 确保生产模式构建
      
      # 这个步骤是关键：将构建产物上传为 GitHub Pages 可以识别的制品
      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'           # Vue 项目的构建输出目录
  
  # 部署阶段 - 这个阶段完成后，Pages 页面就会显示链接
  deploy:
    # 指定部署环境，这会在仓库的 Settings -> Environments 中显示
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}  # 这里会输出访问地址
    
    runs-on: ubuntu-latest
    needs: build  # 确保先执行构建阶段
    
    steps:
      - name: 部署到 GitHub Pages
        id: deployment  # 这个 id 很重要，用于输出 URL
        uses: actions/deploy-pages@v4
